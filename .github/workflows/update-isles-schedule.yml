name: Update Islanders schedule

on:
  schedule:
    # Every 2 hours, so scores and schedule changes show up the same night.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-isles-schedule
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch schedule
        run: python3 scripts/update_isles_schedule.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/isles-schedule.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/isles-schedule.json
          git commit -m "Update Islanders schedule"
          git push
